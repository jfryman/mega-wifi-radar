# Builds the cart + emulator ROMs, the relay image and relay binaries; publishes a release on v* tags.
# The SGDK build image is cached in GHCR under the same content hash scripts/md uses.
name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  SDK_IMAGE: ghcr.io/${{ github.repository_owner }}/mega-wifi-radar-sgdk
  RELAY_IMAGE: ghcr.io/${{ github.repository_owner }}/mega-wifi-radar-relay
  PUSH: ${{ github.event_name != 'pull_request' }}
  CTR: docker

jobs:
  rom:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0          # git describe needs tags

      - name: Log in to GHCR
        if: env.PUSH == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Get build image (pull, else build and push)
        run: |
          LOCAL=$(scripts/md --name)
          REMOTE="$SDK_IMAGE:${LOCAL#*:}"
          if docker pull "$REMOTE"; then
            docker tag "$REMOTE" "$LOCAL"
          else
            docker build -t "$LOCAL" -f docker/Dockerfile \
              --label "org.opencontainers.image.source=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" .
            if [ "$PUSH" = true ]; then
              docker tag "$LOCAL" "$REMOTE" && docker push "$REMOTE"
            fi
          fi

      - name: Build ROMs
        run: |
          test ! -e src/dev_config.h
          make sim
          make release
          V=$(git describe --tags --always)
          mkdir dist
          cp out/rom.bin "dist/mega-wifi-radar-$V.bin"
          cp out/sim.bin "dist/mega-wifi-radar-$V-emu.bin"
          (cd dist && sha256sum *.bin > SHA256SUMS && cat SHA256SUMS)

      - uses: actions/upload-artifact@v4
        with:
          name: roms
          path: dist/
          if-no-files-found: error

  relay:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0          # git describe names the binaries

      - uses: actions/setup-go@v5
        with:
          go-version-file: relay/go.mod
          cache: false

      - name: Vet and test
        run: |
          (cd relay && go vet ./... && go test ./...)
          (cd tools && go vet ./...)

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: env.PUSH == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.RELAY_IMAGE }}
          tags: |
            type=edge,branch=main
            type=semver,pattern={{version}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=ref,event=pr

      - uses: docker/build-push-action@v6
        with:
          context: relay
          platforms: linux/amd64,linux/arm64
          push: ${{ env.PUSH == 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: VERSION=${{ steps.meta.outputs.version }}

      - name: Build relay binaries
        env:
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          V=$(git describe --tags --always)
          mkdir dist
          for t in linux/amd64 linux/arm64 darwin/arm64; do
            os=${t%/*} arch=${t#*/} dir="out/relay-$os-$arch"
            mkdir -p "$dir" && cp LICENSE "$dir/"
            (cd relay && CGO_ENABLED=0 GOOS=$os GOARCH=$arch go build -trimpath \
              -ldflags="-s -w -X main.version=$VERSION" -o "../$dir/relay" .)
            tar -czf "dist/mega-wifi-radar-$V-relay-$os-$arch.tar.gz" -C "$dir" relay LICENSE
          done
          ls -l dist

      - uses: actions/upload-artifact@v4
        with:
          name: relay
          path: dist/
          if-no-files-found: error

  print:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0          # version on the manual's back cover

      - name: Build label, cover and manual
        run: |
          scripts/print
          V=$(git describe --tags --always)
          mkdir dist
          for f in label cover manual; do
            cp "out/print/$f.pdf" "dist/mega-wifi-radar-$V-$f.pdf"
          done
          cp out/print/cover-a4.pdf "dist/mega-wifi-radar-$V-cover-a4.pdf"
          cp out/print/manual-booklet-us-letter.pdf "dist/mega-wifi-radar-$V-manual-booklet-letter.pdf"
          cp out/print/manual-booklet-a4.pdf "dist/mega-wifi-radar-$V-manual-booklet-a4.pdf"

      - uses: actions/upload-artifact@v4
        with:
          name: print
          path: dist/
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [rom, relay, print]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: roms
          path: dist

      - uses: actions/download-artifact@v4
        with:
          name: print
          path: dist

      - uses: actions/download-artifact@v4
        with:
          name: relay
          path: dist

      - name: Relay compose file, pinned to this release
        run: |
          V=${GITHUB_REF_NAME#v}
          sed "s|mega-wifi-radar-relay:latest|mega-wifi-radar-relay:$V|" relay/compose.yaml \
            > "dist/mega-wifi-radar-$GITHUB_REF_NAME-relay-compose.yaml"
          grep -q "mega-wifi-radar-relay:$V\$" "dist/mega-wifi-radar-$GITHUB_REF_NAME-relay-compose.yaml"

      - name: Release notes from CHANGELOG.md, plus how to run this release's relay
        run: |
          V=${GITHUB_REF_NAME#v}
          awk -v v="$V" '$0 ~ "^## " v " " {f=1; next} /^## /{f=0} f' CHANGELOG.md > notes.md
          test -s notes.md || { echo "CHANGELOG.md has no '## $V (...)' section" >&2; exit 1; }
          DL="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/releases/download/$GITHUB_REF_NAME"
          P="mega-wifi-radar-$GITHUB_REF_NAME"
          cat >> notes.md <<EOF

          ## Relay

          Run the relay from this release: it serves only $GITHUB_REF_NAME cartridges. It announces itself
          over mDNS, so leave the cart's RELAY on AUTO. More in [docs/relay.md]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/blob/$GITHUB_REF_NAME/docs/relay.md).

          **Linux / Raspberry Pi, Docker:**
          \`\`\`sh
          docker run -d --name mwradar-relay --restart unless-stopped --network host \\
              -v mwradar-data:/data -e RELAY_DB=/data/relay.db $RELAY_IMAGE:$V
          \`\`\`
          or with compose:
          \`\`\`sh
          curl -LO $DL/$P-relay-compose.yaml
          docker compose -f $P-relay-compose.yaml up -d
          \`\`\`

          **No Docker (Linux amd64/arm64, macOS Apple silicon):** download \`$P-relay-<os>-<arch>.tar.gz\`, then
          \`\`\`sh
          tar -xzf $P-relay-darwin-arm64.tar.gz
          ./relay -db relay.db
          \`\`\`
          On macOS, a file downloaded with a browser needs \`xattr -d com.apple.quarantine relay\` first, and allow
          "Local Network" access when asked.
          EOF
          cat notes.md

      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          (cd dist && sha256sum *.bin *.pdf *.tar.gz *.yaml > SHA256SUMS)
          gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" \
            --title "$GITHUB_REF_NAME" --notes-file notes.md
